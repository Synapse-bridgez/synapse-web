changelog:
  exclude:
    labels: ["skip-changelog"]
  categories:
    - title: "Breaking changes"
      labels: ["breaking-change"]
    - title: "Security"
      labels: ["security"]
    - title: "Features"
      labels: ["feature", "enhancement"]
    - title: "Fixes"
      labels: ["fix", "bug"]
    - title: "Documentation"
      labels: ["docs"]
    - title: "Other changes"
      labels: ["*"]

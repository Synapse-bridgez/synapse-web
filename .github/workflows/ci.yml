name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-typecheck-test-build:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Node version is read from .nvmrc rather than hardcoded here, so the
      # runner, local `nvm use`, and the Docker dev environment cannot drift apart.
      # .nvmrc is verified against package.json "engines" by the step below.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      # Fail fast, before anything is installed, built, or cached. See #172: the
      # repo history already contains a jsdom/Node incompatibility fix and a
      # lockfile regenerated to match CI's npm, both caused by this drifting.
      - name: Verify pinned Node and npm versions
        run: node scripts/check-toolchain.mjs

      - name: Install dependencies
        run: npm ci

      # `npm ci` is defined never to write the lockfile. If it did — because the
      # lockfile was generated by a different npm, or is internally inconsistent —
      # the install would silently diverge from what is committed, which is the
      # exact failure mode of the "regenerate package-lock.json to match CI" commit
      # in this repo's history.
      - name: Verify npm ci left the lockfile untouched
        run: |
          if ! git diff --exit-code -- package-lock.json; then
            echo "::error::npm ci modified package-lock.json. The committed lockfile is not consistent with the pinned toolchain. Regenerate it locally with the pinned Node/npm and commit the result."
            exit 1
          fi
          echo "package-lock.json unchanged by npm ci"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

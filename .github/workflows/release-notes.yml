name: Release notes
on:
  pull_request:
    types: [opened, labeled, unlabeled, synchronize]
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
jobs:
  label-reminder:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const categories = ['breaking-change', 'security', 'feature', 'enhancement', 'fix', 'bug', 'docs'];
            const labels = context.payload.pull_request.labels.map(({name}) => name);
            if (!categories.some((label) => labels.includes(label))) {
              core.warning('Add a changelog category label; unlabeled PRs appear under Other changes.');
            }
  draft:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Contributor leaderboard
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
  issues: read
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/generate-contributors.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTRIBUTOR_SCOPE_LABEL: drips-wave
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: refresh contributor leaderboard"
